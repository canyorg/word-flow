name: Windows exe

on:
  push:
    branches: [main]
    paths: ["wordflow.py", "wordlists/**", "icon.*", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyQt6 pyinstaller

      - name: Smoke test (all 12 language pairs)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import wordflow as w; from PyQt6.QtWidgets import QApplication; app = QApplication([]); [w.WordWidget(p).close() for p in w.PAIRS]; print('ok', len(w.PAIRS), 'pairs')"

      - name: Build one-file exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WordFlow
          --icon icon.ico --add-data "icon.png;."
          --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml
          --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtMultimedia
          wordflow.py

      - uses: actions/upload-artifact@v4
        with:
          name: WordFlow-windows
          path: dist/WordFlow.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Word Flow 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/WordFlow.exe
          body: |
            **Windows:** download `WordFlow.exe` below and double-click it. No installation, no Python needed.
            If Windows shows "Windows protected your PC", click **More info → Run anyway** (the exe isn't signed).

            **Linux:** see the README (`./install.sh --autostart`).
